<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Duelo dos Dados</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#11152a;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh}
.game{width:min(900px,96vw);background:#1b2140;border:5px solid #3b467a;border-radius:18px;padding:24px;text-align:center;box-shadow:0 15px 50px #0008}
h1{margin:0 0 8px;font-size:42px;color:#ffd85a}.sub{color:#aeb8e8;margin-bottom:20px}.board{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{background:#11162c;border:3px solid #343e70;border-radius:14px;padding:18px}.card h2{margin:0 0 15px}.dice{display:flex;justify-content:center;gap:14px;min-height:105px}
.die{width:90px;height:90px;background:#f7f7f7;color:#171b2d;border-radius:14px;display:flex;justify-content:center;align-items:center;font-size:58px;font-weight:bold;box-shadow:inset 0 -5px 0 #c8c8c8}
.equal{color:#65ef91;font-weight:bold;font-size:22px;height:30px}button{margin-top:22px;background:#e34d68;color:white;border:0;border-radius:12px;padding:15px 35px;font-size:20px;font-weight:bold;cursor:pointer}
button:hover{filter:brightness(1.15)}#result{font-size:28px;font-weight:bold;margin:22px 0 5px;min-height:36px}.score{display:flex;justify-content:center;gap:40px;margin-top:15px;color:#cbd2f4}
.rules{margin-top:20px;color:#929cc7;font-size:14px}@media(max-width:650px){.board{grid-template-columns:1fr}.die{width:75px;height:75px;font-size:48px}}
</style>
</head>
<body><div class="game"><h1>🎲 DUELO DOS DADOS</h1><div class="sub">Você contra o competidor</div>
<div class="board"><div class="card"><h2>🧑 Você</h2><div class="dice"><div class="die" id="p1">?</div><div class="die" id="p2">?</div></div><div class="equal" id="pe"></div></div>
<div class="card"><h2>🤖 Competidor</h2><div class="dice"><div class="die" id="b1">?</div><div class="die" id="b2">?</div></div><div class="equal" id="be"></div></div></div>
<button id="roll">🎲 JOGAR DADOS</button><div id="result">Clique para jogar!</div><div class="score"><span>Você: <b id="ps">0</b></span><span>Competidor: <b id="bs">0</b></span></div>
<div class="rules">Regra: ganha quem tirar dois dados iguais. Se os dois tiverem pares, o par maior vence. Se nenhum tiver dados iguais, a rodada termina em empate.</div></div>
<script>
const faces=["⚀","⚁","⚂","⚃","⚄","⚅"];let ps=0,bs=0,playing=false;
function rand(){return Math.floor(Math.random()*6)+1}function show(id,n){document.getElementById(id).textContent=faces[n-1]}function equal(a,b){return a===b}
document.getElementById("roll").onclick=()=>{if(playing)return;playing=true;document.getElementById("result").textContent="🎲 Rolando...";document.getElementById("pe").textContent="";document.getElementById("be").textContent="";let ticks=0;const anim=setInterval(()=>{show("p1",rand());show("p2",rand());show("b1",rand());show("b2",rand());ticks++;if(ticks>=8){clearInterval(anim);finish();playing=false}},90)};
function finish(){const a=+getValue("p1"),b=+getValue("p2"),c=+getValue("b1"),d=+getValue("b2"),pe=equal(a,b),be=equal(c,d);if(pe)document.getElementById("pe").textContent="✨ DADOS IGUAIS!";if(be)document.getElementById("be").textContent="✨ DADOS IGUAIS!";let result="";if(pe&&!be){ps++;result="🏆 VOCÊ GANHOU!"}else if(be&&!pe){bs++;result="🤖 O COMPETIDOR GANHOU!"}else if(pe&&be){if(a>c){ps++;result="🏆 VOCÊ GANHOU! Par maior!"}else if(c>a){bs++;result="🤖 O COMPETIDOR GANHOU! Par maior!"}else result="🤝 EMPATE! Pares iguais!"}else{result="🤝 EMPATE! Ninguém tirou dados iguais."}document.getElementById("result").textContent=result;document.getElementById("ps").textContent=ps;document.getElementById("bs").textContent=bs}
function getValue(id){const t=document.getElementById(id).textContent;return faces.indexOf(t)+1}
</script></body></html>
