name: publicar site

# Todo push na main reconstroi a galeria e empurra o resultado para a branch
# `publicado`, que e o que o Render serve.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Se dois merges acontecerem juntos, publica so o ultimo.
concurrency:
  group: publicar
  cancel-in-progress: true

permissions:
  contents: write        # necessario para empurrar a branch publicado

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # O pygbag baixa o runtime WebAssembly na primeira compilacao.
      # O cache evita esse download em todo deploy.
      - name: Cache do pygbag
        uses: actions/cache@v4
        with:
          path: ~/.cache/pygbag
          key: pygbag-${{ runner.os }}-v1

      - name: Instalar dependencias
        run: pip install pygbag pygame

      - name: Validar entregas
        run: python ferramentas/validar.py

      - name: Montar o site
        run: python ferramentas/construir.py

      # A branch `publicado` e descartavel: contem so o site montado, com
      # historico achatado (force_orphan). Nunca edite nada nela - o proximo
      # deploy sobrescreve tudo.
      - name: Publicar na branch que o Render serve
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: publicado
          force_orphan: true
          commit_message: "site montado a partir de ${{ github.sha }}"
