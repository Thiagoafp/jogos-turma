# Site estatico no Render.
#
# O Render NAO constroi nada aqui: ele serve a pasta pronta que o GitHub
# Actions publica na branch `publicado`.
#
# Por que nao deixar o Render construir: o build precisa de Python e do
# pygbag, que baixa um runtime WebAssembly de dezenas de MB. O ambiente de
# build de site estatico do Render nao garante nenhum dos dois, e uma falha
# la derruba o site inteiro - inclusive os jogos que nao tem nada a ver com
# Python. Construindo no Actions, o Render so precisa saber servir arquivo.
#
# Static Site no Render nao hiberna: quem dorme no plano gratuito e o Web
# Service. Um pai abrindo o link as 22h de domingo vai encontrar o site no ar.

services:
  - type: web
    name: arcade-da-turma
    runtime: static
    repo: https://github.com/SEU-USUARIO/jogos-turma   # ajuste apos criar o repo
    branch: publicado          # branch que o Actions atualiza a cada merge
    buildCommand: ""           # nada a construir: ja vem pronto
    staticPublishPath: .
    pullRequestPreviewsEnabled: false

    headers:
      # Os arquivos com hash no nome (assets do Phaser, .apk do pygbag) podem
      # ser cacheados para sempre; o HTML nao, senao o aluno publica um jogo
      # novo e o pai continua vendo o antigo.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
